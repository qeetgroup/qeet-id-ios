name: CI

# Verify: the essential checks, kept short because macOS minutes are scarce. swift-format, one simulator build of the
# app and its tests (warnings are errors), which type-checks everything, and a secret scan of the pull request. Runs on pull requests into develop and
# main (a release branch is checked once, on its pull request into main), and on request. The unit and UI tests and the Release build for devices run
# locally before every push (AGENTS.md, "Before you finish").
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Xcode the app is verified with, on GitHub's xcode-27 runner image (as Qeetrix for iOS pins it). If the image
  # stops carrying it, the select step fails loudly: update the pin and re-verify locally.
  XCODE_VERSION: "27.1"

jobs:
  verify:
    name: Verify
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the pull request's commits, for the secret scan
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Format (swift-format)
        run: Scripts/lint.sh

      # Warnings are errors in every target (Configs/Project.xcconfig). Simulator builds sign to run locally and
      # need no team; a generic destination needs no booted simulator.
      - name: Build the app and its tests
        run: |
          xcodebuild build-for-testing -project QeetID.xcodeproj -scheme QeetID \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/xcode

      # The free gitleaks CLI (the gitleaks Action needs a paid licence for an organisation), pinned and
      # checksum-verified for this runner's architecture, over this pull request's commits.
      - name: Secret scan
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: 8.30.1
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$(uname -m)" in
            arm64) arch=darwin_arm64 sum=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
            *) arch=darwin_x64 sum=dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709 ;;
          esac
          archive="gitleaks_${GITLEAKS_VERSION}_${arch}.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          (cd "$RUNNER_TEMP" && echo "${sum}  ${archive}" | shasum -a 256 --check --strict && tar -xzf "$archive" gitleaks)
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 --log-opts="$BASE_SHA..$HEAD_SHA" .
